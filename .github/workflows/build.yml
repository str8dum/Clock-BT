name: Build APK
on: [push, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: clock-usb-main
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Restore development signing identity
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: clock-usb-debug-signing-v1
      - run: gradle assembleDebug lintDebug
      - name: Record exact source revision
        run: |
          git rev-parse HEAD > app/build/outputs/apk/debug/SOURCE_COMMIT.txt
          sha256sum app/build/outputs/apk/debug/app-debug.apk > app/build/outputs/apk/debug/APK_SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Clock-BT-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/SOURCE_COMMIT.txt
            app/build/outputs/apk/debug/APK_SHA256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Clock-USB-lint-results
          path: app/build/reports/lint-results-debug.*
